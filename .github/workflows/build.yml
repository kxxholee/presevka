name: build

# A full Iosevka build plus hinting takes well over half an hour, so run it
# once per change: branch pushes are covered by their pull request, and only
# main builds on push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "tools/**"
      - "LICENSE"
      - "LICENSE-CODE"
      - "OFL.txt"
      - "THIRD_PARTY.md"
      - "FONTLOG.md"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "tools/**"
      - "LICENSE"
      - "LICENSE-CODE"
      - "OFL.txt"
      - "THIRD_PARTY.md"
      - "FONTLOG.md"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Iosevka is a shallow clone plus a full npm install; both dominate the
      # build. Keyed on the pinned refs so a version bump invalidates the cache.
      - name: Restore upstream sources
        uses: actions/cache@v4
        with:
          path: |
            .cache/src/Iosevka
            .cache/src/pretendard
          key: upstream-${{ hashFiles('scripts/build_iosevka.sh', 'scripts/build_pretendard.sh') }}
          restore-keys: upstream-

      - name: Build Presevka
        run: ./scripts/build.sh

      - name: Upload font artifact
        uses: actions/upload-artifact@v4
        with:
          name: presevka-ttf
          path: |
            dist/Presevka-*.ttf
            dist/OFL.txt
            dist/licenses/
            dist/THIRD_PARTY.md
            dist/FONTLOG.md
