# Presevka's Latin base: stock/default Iosevka glyph design at 432/1000 em.
# No character variants are overridden here.

[buildPlans.PresevkaBase432]
family = "Presevka Base 432"
spacing = "normal"
serifs = "sans"
exportGlyphNames = false

# Build only Regular Upright for the first reproducible Presevka prototype.
[buildPlans.PresevkaBase432.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.PresevkaBase432.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

# 432 * 2 = 864, matching the normalized Pretendard Hangul cell.
[buildPlans.PresevkaBase432.widths.Normal]
shape = 432
menu = 5
css = "normal"
