# Presevka Latin base — Iosevka SS14 (JetBrains Mono Style), 480-unit width.
# Target Iosevka: v34.8.0.
#
# Glyph variants inherit Iosevka's maintained ss14 preset unchanged.
# Presevka supplies its own family metadata and nine weights with upright and
# italic slopes. The 480-unit Latin cell pairs with a 960-unit Hangul cell.

[buildPlans.PresevkaBase480]
family = "Presevka Base 480"
spacing = "normal"
serifs = "sans"
exportGlyphNames = false

[buildPlans.PresevkaBase480.variants]
inherits = "ss14"

# Match Pretendard's nine static weights.
[buildPlans.PresevkaBase480.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.PresevkaBase480.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.PresevkaBase480.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.PresevkaBase480.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.PresevkaBase480.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.PresevkaBase480.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.PresevkaBase480.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.PresevkaBase480.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.PresevkaBase480.weights.Black]
shape = 900
menu = 900
css = 900

# Iosevka supplies both native Upright and Italic Latin designs. The merge step
# deliberately keeps Pretendard Hangul upright in both faces.
[buildPlans.PresevkaBase480.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.PresevkaBase480.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Slightly condensed Latin cell paired with a strict two-cell Hangul grid.
[buildPlans.PresevkaBase480.widths.Normal]
shape = 480
menu = 5
css = "normal"
